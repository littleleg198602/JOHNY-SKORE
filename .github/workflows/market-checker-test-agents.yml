name: Market Checker test agents

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-agent:
    name: Contract, source and persistence agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_checker_app/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r market_checker_app/requirements.txt
      - name: Compile every Python module
        run: python -m compileall -q market_checker_app tests
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  scale-agent:
    name: 687 ticker scale and progress agent
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_checker_app/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r market_checker_app/requirements.txt
      - name: Verify exact 687-ticker contract
        run: python -m unittest discover -s tests -p 'test_687_ticker_contract.py' -v

  ui-agent:
    name: Streamlit UI agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market_checker_app/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r market_checker_app/requirements.txt
      - name: Verify the application and Yahoo controls render
        run: python -m unittest discover -s tests -p 'test_streamlit_ui_smoke.py' -v

  release-agent:
    name: Deterministic release gate
    if: always()
    needs: [contract-agent, scale-agent, ui-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test agent to pass
        env:
          CONTRACT_RESULT: ${{ needs.contract-agent.result }}
          SCALE_RESULT: ${{ needs.scale-agent.result }}
          UI_RESULT: ${{ needs.ui-agent.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$SCALE_RESULT" = "success"
          test "$UI_RESULT" = "success"
